[package]
name = "hum-app"
description = "Hum: a beginner-friendly synth playground (UI + audio glue)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hum_app"
# cdylib: loaded by Android's NativeActivity. rlib: used by the desktop binary.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hum-app"
path = "src/main.rs"

[features]
# Type-check the Android JNI glue on the host (dev aid; never shipped).
jni-check = ["dep:jni", "dep:ndk-context"]

[dependencies]
hum-engine.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
winit = { version = "0.30.13", default-features = false }
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
jni = { version = "0.22.4", optional = true }
ndk-context = { version = "0.1.1", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland"] }
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "android-native-activity"] }
cpal = { version = "0.18.2", features = ["realtime"] }
android_logger = "0.15.1"
jni = "0.22.4"
ndk-context = "0.1.1"
